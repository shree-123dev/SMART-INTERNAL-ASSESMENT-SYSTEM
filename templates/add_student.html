<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | SIAMS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body{
            background:#f4f7fc;
            font-family:Poppins,sans-serif;
        }

        .container{
            width:600px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        h2{
            text-align:center;
            color:#1e3c72;
            margin-bottom:25px;
        }

        input,select{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:14px;
            background:#1e3c72;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
        }

        button:hover{
            background:#2a5298;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Add Student</h2>

<form action="/add_student" method="POST">

<input type="text"
name="usn"
placeholder="Student USN"
required>

<input type="text"
name="fullname"
placeholder="Student Full Name"
required>

<input type="email"
name="email"
placeholder="Email"
required>

<input type="text"
name="department"
placeholder="Department"
required>

<input type="number"
name="semester"
placeholder="Semester"
required>

<input type="text"
name="section"
placeholder="Section"
required>

<button type="submit">

Save Student

</button>

</form>

</div>

</body>
</html>
