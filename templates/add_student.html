<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll New Student | SIAMS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

    <div class="auth-container" style="max-width: 620px;">
        <div class="auth-box" style="padding: 40px 35px;">

            <div class="auth-header">
                <div class="auth-logo" style="background: #eef2ff; color: #4f46e5;">
                    <i class="fas fa-user-plus" style="font-size: 24px;"></i>
                </div>
                <h2>Enroll New Student</h2>
                <p>Register student details & automatically generate QR identification</p>
            </div>

            <form action="/add_student" method="POST">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="usn">Student USN / Roll No</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-badge"></i>
                            <input
                                type="text"
                                id="usn"
                                name="usn"
                                class="form-control"
                                placeholder="e.g. 1MS21CS001"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input
                                type="text"
                                id="fullname"
                                name="fullname"
                                class="form-control"
                                placeholder="Student Full Name"
                                required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Institutional Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="student@college.edu"
                            required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <div class="input-wrapper">
                            <i class="fas fa-graduation-cap"></i>
                            <input
                                type="text"
                                id="department"
                                name="department"
                                class="form-control"
                                placeholder="e.g. CSE"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <div class="input-wrapper">
                            <i class="fas fa-layer-group"></i>
                            <input
                                type="number"
                                id="semester"
                                name="semester"
                                class="form-control"
                                placeholder="e.g. 5"
                                min="1"
                                max="8"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="section">Section</label>
                        <div class="input-wrapper">
                            <i class="fas fa-users-class"></i>
                            <input
                                type="text"
                                id="section"
                                name="section"
                                class="form-control"
                                placeholder="e.g. A"
                                required>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 10px;">
                    <button type="submit" class="auth-btn">
                        <i class="fas fa-qrcode" style="margin-right: 8px;"></i> Save Student & Generate QR
                    </button>
                </div>

            </form>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);">
                <a href="{{ url_for('view_students') }}" style="color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-table"></i> View Student Roster
                </a>
                <a href="{{ url_for('teacher') }}" style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
