<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SIAMS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-box">

            <div class="auth-header">
                <div class="auth-logo">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SIAMS">
                </div>
                <h2>Create an Account</h2>
                <p>Register to get started with SIAMS Portal</p>
            </div>

            {% if error %}
            <div style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-exclamation-circle" style="font-size: 16px;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/signup" method="POST">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Institutional Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="e.g. name@college.edu"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a strong password"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="role">Account Role</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-tag"></i>
                        <select id="role" name="role" class="form-control" required>
                            <option value="">-- Select Your Role --</option>
                            <option value="student">👨‍🎓 Student</option>
                            <option value="teacher">👨‍🏫 Teacher / Faculty</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="auth-btn">
                    <i class="fas fa-user-plus"></i> Complete Registration
                </button>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="{{ url_for('login') }}">Sign In Here</a>
            </div>

            <div>
                <a href="{{ url_for('home') }}" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Homepage
                </a>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>

</html>
