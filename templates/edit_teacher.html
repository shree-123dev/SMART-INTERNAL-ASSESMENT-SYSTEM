<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Faculty Member | SIAMS Admin</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

    <div class="auth-container" style="max-width: 580px;">
        <div class="auth-box" style="padding: 40px 35px;">

            <div class="auth-header">
                <div class="auth-logo" style="background: #e0f2fe; color: #0284c7;">
                    <i class="fas fa-user-edit" style="font-size: 24px;"></i>
                </div>
                <h2>Edit Faculty Details</h2>
                <p>Update credentials for <strong>{{ teacher['teacher_id'] }}</strong></p>
            </div>

            {% if error %}
            <div style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 600;">
                <i class="fas fa-exclamation-circle" style="font-size: 16px;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('edit_teacher', teacher_id=teacher['teacher_id']) }}" method="POST">

                <div class="form-group">
                    <label for="teacher_id_display">Teacher ID (Permanent)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock" style="color: var(--text-muted);"></i>
                        <input
                            type="text"
                            id="teacher_id_display"
                            class="form-control"
                            value="{{ teacher['teacher_id'] }}"
                            disabled
                            style="background: var(--bg-main); cursor: not-allowed; font-weight: 700;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-tie"></i>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            class="form-control"
                            value="{{ teacher['fullname'] }}"
                            placeholder="e.g. Dr. John Doe"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Institutional Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            value="{{ teacher['email'] }}"
                            placeholder="faculty@college.edu"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="department">Academic Department</label>
                    <div class="input-wrapper">
                        <i class="fas fa-building-columns"></i>
                        <input
                            type="text"
                            id="department"
                            name="department"
                            class="form-control"
                            value="{{ teacher['department'] }}"
                            placeholder="e.g. Computer Science"
                            required>
                    </div>
                </div>

                <div style="margin-top: 24px; display: flex; gap: 12px;">
                    <button type="submit" class="auth-btn" style="flex: 1; background: linear-gradient(135deg, #0284c7, #0369a1);">
                        <i class="fas fa-save" style="margin-right: 8px;"></i> Save Changes
                    </button>
                    <a href="{{ url_for('view_teachers') }}" class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; padding: 0 20px;">
                        Cancel
                    </a>
                </div>

            </form>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);">
                <a href="{{ url_for('view_teacher', teacher_id=teacher['teacher_id']) }}" style="color: var(--secondary-hover); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-eye"></i> View Profile
                </a>
                <a href="{{ url_for('view_teachers') }}" style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-arrow-left"></i> Back to Faculty List
                </a>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
