<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject | SIAMS Admin</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

    <div class="auth-container" style="max-width: 600px;">
        <div class="auth-box" style="padding: 40px 35px;">

            <div class="auth-header">
                <div class="auth-logo" style="background: #fef3c7; color: #d97706;">
                    <i class="fas fa-edit" style="font-size: 24px;"></i>
                </div>
                <h2>Edit Subject Details</h2>
                <p>Update curriculum course for <strong>{{ subject['subject_code'] }}</strong></p>
            </div>

            {% if error %}
            <div style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 600;">
                <i class="fas fa-exclamation-circle" style="font-size: 16px;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('edit_subject', subject_code=subject['subject_code']) }}" method="POST">

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 16px;">
                    <div class="form-group">
                        <label for="subject_code_display">Subject Code (Permanent)</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock" style="color: var(--text-muted);"></i>
                            <input
                                type="text"
                                id="subject_code_display"
                                class="form-control"
                                value="{{ subject['subject_code'] }}"
                                disabled
                                style="background: var(--bg-main); cursor: not-allowed; font-weight: 700;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="subject_name">Subject Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-book"></i>
                            <input
                                type="text"
                                id="subject_name"
                                name="subject_name"
                                class="form-control"
                                value="{{ subject['subject_name'] }}"
                                placeholder="e.g. Database Management Systems"
                                required>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <div class="input-wrapper">
                            <i class="fas fa-building-columns"></i>
                            <input
                                type="text"
                                id="department"
                                name="department"
                                class="form-control"
                                value="{{ subject['department'] }}"
                                placeholder="e.g. Computer Science"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <div class="input-wrapper">
                            <i class="fas fa-layer-group"></i>
                            <input
                                type="number"
                                id="semester"
                                name="semester"
                                class="form-control"
                                value="{{ subject['semester'] }}"
                                placeholder="e.g. 5"
                                min="1"
                                max="8"
                                required>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 24px; display: flex; gap: 12px;">
                    <button type="submit" class="auth-btn" style="flex: 1; background: linear-gradient(135deg, #d97706, #b45309);">
                        <i class="fas fa-save" style="margin-right: 8px;"></i> Save Changes
                    </button>
                    <a href="{{ url_for('view_subjects') }}" class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; padding: 0 20px;">
                        Cancel
                    </a>
                </div>

            </form>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);">
                <a href="{{ url_for('view_subject', subject_code=subject['subject_code']) }}" style="color: #d97706; text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-eye"></i> View Details
                </a>
                <a href="{{ url_for('view_subjects') }}" style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-arrow-left"></i> Back to Subjects
                </a>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
