<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Subject to Faculty | SIAMS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

    <div class="auth-container" style="max-width: 600px;">
        <div class="auth-box" style="padding: 40px 35px;">

            <div class="auth-header">
                <div class="auth-logo" style="background: #ecfdf5; color: #10b981;">
                    <i class="fas fa-link" style="font-size: 24px;"></i>
                </div>
                <h2>Assign Subject to Faculty</h2>
                <p>Link course subjects with responsible instructors for practical sessions</p>
            </div>

            <form action="/assign_subject" method="POST">

                <div class="form-group">
                    <label for="teacher_id">Select Faculty Instructor</label>
                    <div class="input-wrapper">
                        <i class="fas fa-chalkboard-teacher"></i>
                        <select id="teacher_id" name="teacher_id" class="form-control" required style="cursor: pointer;">
                            <option value="">-- Choose Instructor --</option>
                            {% for teacher in teachers %}
                            <option value="{{ teacher[0] }}">
                                {{ teacher[1] }} (ID: {{ teacher[0] }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="subject_code">Select Curriculum Subject</label>
                    <div class="input-wrapper">
                        <i class="fas fa-book"></i>
                        <select id="subject_code" name="subject_code" class="form-control" required style="cursor: pointer;">
                            <option value="">-- Choose Subject Course --</option>
                            {% for subject in subjects %}
                            <option value="{{ subject[0] }}">
                                {{ subject[1] }} [Code: {{ subject[0] }}]
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div style="background: #f8fafc; border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 16px; margin: 20px 0; font-size: 13px; color: var(--text-muted); display: flex; gap: 12px; align-items: flex-start;">
                    <i class="fas fa-info-circle" style="color: var(--primary); font-size: 16px; margin-top: 2px;"></i>
                    <span>Once assigned, the subject will appear on the faculty member's portal to conduct practical sessions and mark QR attendance.</span>
                </div>

                <div>
                    <button type="submit" class="auth-btn" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <i class="fas fa-check-circle" style="margin-right: 8px;"></i> Complete Subject Assignment
                    </button>
                </div>

            </form>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);">
                <a href="{{ url_for('view_teachers') }}" style="color: #10b981; text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-users"></i> View Faculty
                </a>
                <a href="{{ url_for('admin') }}" style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

        </div>
    </div>

</body>
</html>
