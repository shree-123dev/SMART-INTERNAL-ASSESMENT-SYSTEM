<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Subjects | SIAMS</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7fc;
    padding:30px;
}

h2{
    text-align:center;
    color:#1e3c72;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#1e3c72;
    color:white;
}

button{

    padding:10px 18px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}

button:hover{

    background:#218838;

}

</style>

</head>

<body>

<h2>My Assigned Subjects</h2>

<table>

<tr>

<th>Subject Code</th>
<th>Subject Name</th>
<th>Action</th>

</tr>

{% for subject in subjects %}

<tr>

<td>{{ subject[0] }}</td>

<td>{{ subject[1] }}</td>

<td>

<a href="/practical_session/{{ subject[0] }}">
    <button>
        Start Practical
    </button>
</a>

</td>

</tr>

{% endfor %}

</table>

</body>

</html>
