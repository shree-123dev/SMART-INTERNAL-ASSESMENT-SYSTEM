<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Faculty Member | SIAMS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

    <div class="auth-container" style="max-width: 580px;">
        <div class="auth-box" style="padding: 40px 35px;">

            <div class="auth-header">
                <div class="auth-logo" style="background: #e0f2fe; color: #0284c7;">
                    <i class="fas fa-chalkboard-teacher" style="font-size: 24px;"></i>
                </div>
                <h2>Add Faculty Member</h2>
                <p>Register new academic instructor & faculty credentials</p>
            </div>

            <form action="/add_teacher" method="POST">

                <div class="form-group">
                    <label for="teacher_id">Teacher / Employee ID</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input
                            type="text"
                            id="teacher_id"
                            name="teacher_id"
                            class="form-control"
                            placeholder="e.g. TCH101 or EMP-CS-02"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-tie"></i>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            class="form-control"
                            placeholder="e.g. Dr. John Doe / Prof. Smith"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Institutional Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="faculty@college.edu"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="department">Academic Department</label>
                    <div class="input-wrapper">
                        <i class="fas fa-building-columns"></i>
                        <input
                            type="text"
                            id="department"
                            name="department"
                            class="form-control"
                            placeholder="e.g. Computer Science & Engineering"
                            required>
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <button type="submit" class="auth-btn" style="background: linear-gradient(135deg, #0284c7, #0369a1);">
                        <i class="fas fa-user-check" style="margin-right: 8px;"></i> Save Faculty Member
                    </button>
                </div>

            </form>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);">
                <a href="{{ url_for('view_teachers') }}" style="color: var(--secondary-hover); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-list"></i> View Faculty List
                </a>
                <a href="{{ url_for('admin') }}" style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

        </div>
    </div>

</body>
</html>
