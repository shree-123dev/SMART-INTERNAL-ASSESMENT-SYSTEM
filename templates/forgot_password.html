<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SIAMS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-box">

            <div class="auth-header">
                <div class="auth-logo" style="background: #fffbeb; color: #d97706;">
                    <i class="fas fa-key" style="font-size: 24px;"></i>
                </div>
                <h2>Reset Password</h2>
                <p>Enter your institutional email to receive recovery instructions</p>
            </div>

            <form action="{{ url_for('login') }}" method="GET">

                <div class="form-group">
                    <label for="email">Registered Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="e.g. name@college.edu"
                            required>
                    </div>
                </div>

                <button type="submit" class="auth-btn" style="background: linear-gradient(135deg, #1e3c72, #2a5298);">
                    <i class="fas fa-paper-plane"></i> Send Password Reset Link
                </button>

            </form>

            <div class="auth-footer">
                Remember your credentials?
                <a href="{{ url_for('login') }}">Back to Login</a>
            </div>

            <div>
                <a href="{{ url_for('home') }}" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Homepage
                </a>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>

</html>
